server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Límite holgado: el tamaño máximo real de los adjuntos lo controla el backend (MAX_ATTACHMENT_MB).
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Ficheros con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta sirve index.html (sin caché para recoger actualizaciones).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
